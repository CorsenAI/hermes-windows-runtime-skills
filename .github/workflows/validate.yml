name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Install pinned test parser
        shell: pwsh
        run: |
          $python = if ($env:RUNNER_OS -eq 'Windows') {
            Join-Path $env:pythonLocation 'python.exe'
          } else {
            Join-Path $env:pythonLocation 'bin/python'
          }
          & $python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install pinned ripgrep for Git Bash contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ripgrep --version=14.1.1 --yes --no-progress
      - name: Validate with PowerShell 7
        shell: pwsh
        run: |
          $python = if ($env:RUNNER_OS -eq 'Windows') {
            Join-Path $env:pythonLocation 'python.exe'
          } else {
            Join-Path $env:pythonLocation 'bin/python'
          }
          ./tests/run.ps1 -PythonExe $python
      - name: Validate with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $python = Join-Path $env:pythonLocation 'python.exe'
          ./tests/run.ps1 -PythonExe $python

  security:
    name: secret history scan
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned Gitleaks
        shell: pwsh
        run: ./tests/gitleaks.ps1 -RepoRoot $PWD.Path
      - name: Lint workflow with pinned actionlint
        shell: pwsh
        run: ./tests/actionlint.ps1 -RepoRoot $PWD.Path

  archive:
    name: archive hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run the release packaging gate
        shell: pwsh
        run: ./tests/package.ps1 -RepoRoot $PWD.Path -OutputPath (Join-Path $env:RUNNER_TEMP 'hermes-windows-runtime-skills-v0.1.0.zip')
